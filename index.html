<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Thakur Clinic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side no-print">
    <div class="brand"><div class="logo" id="logoBox">TC</div><div><b>Thakur Clinic</b><small>Dr Ashwin Thakur</small></div></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <div class="top no-print">
      <div class="search"><input id="globalSearch" autocomplete="off" data-ip="search_ph"><div id="searchResults" class="results hidden"></div></div>
      <div class="actions">
        <span id="syncStatus" class="sync"></span>
        <button class="btn" id="langBtn">मराठी</button>
        <button class="btn" id="logoutBtn" style="display:none" data-i="sign_out"></button>
        <button class="btn primary" id="newPatientBtn" data-i="new_patient_btn"></button>
      </div>
    </div>
    <div id="page"></div>
  </main>
</div>

<div id="loginBox" class="loginbox"><div class="logincard"><div class="logo">TC</div><h2>Thakur Clinic</h2><p>Dr Ashwin Thakur</p><button class="btn primary big" id="googleBtn" data-i="sign_in_google"></button><p id="loginMsg" class="loginmsg"></p><small data-i="staff_only"></small></div></div>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div>
<div id="toast" class="toast"></div>
<datalist id="medList"></datalist>
<datalist id="doseList"><option value="1 tablet"><option value="1 capsule"><option value="5 ml"><option value="10 ml"><option value="1 sachet"><option value="2 drops"><option value="1 application"></datalist>
<datalist id="freqList"><option value="1-0-1"><option value="1-1-1"><option value="1-0-0"><option value="0-1-0"><option value="0-0-1"><option value="SOS"><option value="Once a week"></datalist>
<datalist id="durList"><option value="3 days"><option value="5 days"><option value="7 days"><option value="10 days"><option value="15 days"><option value="1 month"><option value="Continue"></datalist>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="firebase-config.js"></script>
<script src="i18n.js"></script>
<script src="cloud.js"></script>
<script src="app.js"></script>
</body>
</html>
